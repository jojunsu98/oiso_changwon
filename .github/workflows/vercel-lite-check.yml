name: Vercel Lite checks

on:
  push:
    branches:
      - codyssey-vercel-lite
  pull_request:
    branches:
      - codyssey-vercel-lite

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile api/recommend.py api/chat.py src/policy_matcher.py src/policy_engine.py

      - name: Validate Vercel configuration
        run: python -m json.tool vercel.json > /dev/null

      - name: Run Lite regression tests
        run: python -m unittest tests/test_vercel_lite.py -v
