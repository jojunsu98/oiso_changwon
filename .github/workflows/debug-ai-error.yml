name: Remove temporary AI diagnostics

on:
  push:
    branches:
      - codyssey-vercel-lite
    paths:
      - ".github/workflows/debug-ai-error.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codyssey-vercel-lite

      - name: Remove provider detail from public response
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("api/chat.py")
          text = path.read_text(encoding="utf-8")
          sensitive_line = '                        "detail": str(exc) if error_type == "AIProviderError" else None,\n'
          if sensitive_line in text:
              text = text.replace(sensitive_line, "", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate and commit cleanup
        run: |
          python -m py_compile api/chat.py api/_ai_provider.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/chat.py
          git rm .github/workflows/debug-ai-error.yml
          git commit -m "security: remove temporary AI diagnostics"
          git push origin codyssey-vercel-lite
